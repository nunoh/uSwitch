name: Release

on:
  push:
    branches: [main]
  # Rebuild and re-upload the assets of an existing release, e.g. after a
  # failed build job.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.3.0)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PAT (RELEASE_PLEASE_TOKEN) lets CI run on the release PR; the
      # default token cannot trigger other workflows.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  assets:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history: the build number is the commit count.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Import the signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: scripts/import-signing-cert.sh

      - name: Build DMG and zip
        run: make dmg VERSION="${TAG#v}"

      # The update window shows this version's CHANGELOG.md entry.
      - name: Write the release notes
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Sign the Sparkle update feed
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: scripts/make-appcast.sh "dist/uSwitch-${TAG}-arm64.zip" "$TAG" "$RUNNER_TEMP/notes.md"

      - name: Check the signature
        run: scripts/check-signature.sh dist/uSwitch.app

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 uSwitch-*.dmg uSwitch-*.zip | tee SHA256SUMS.txt

      # Lets users check that CI built the files from this repo:
      # gh attestation verify <file> --repo nunoh/uSwitch
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/uSwitch-*.dmg
            dist/uSwitch-*.zip

      - name: Upload to the release
        run: gh release upload "$TAG" dist/uSwitch-*.dmg dist/uSwitch-*.zip dist/SHA256SUMS.txt dist/appcast.xml --clobber
